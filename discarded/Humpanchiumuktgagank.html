    <h4>The Selection</h4>
    <p>I first heard हम पंछी उन्मुक्त গগন के in class seven. Written by Shivmangal Singh ‘Suman’, it is a poem about birds who refuse the gilded cage — who choose the open sky over comfort, who would rather go hungry free than be fed in captivity. I still remember the first two stanzas without trying. Not because I memorized them. Because they meant something before I had the words to explain why. </p>
    <p>The poem reveals a truth about this world: that freedom and comfort are rarely the same thing, and the choice between them is never easy. When the brief came — make a video poem — there was no real deliberation.
    </p>
    <p>
      The course had introduced us to AfterEffects, Touchdesigner, motion graphics, live action. These were offered as the direction. I chose puppets. Not because it was the sophisticated choice — because I hadn’t done it before, and because I wanted to attempt what puppeteers do: tell a whole story in one continuous, unbroken shot. No editing to save you. No cut to fix what the moment couldn’t hold.
    </p>
    <p>What I wanted to capture wasn’t cinematic polish. It was something older — a texture that felt handmade, intimate, slightly imperfect. The feeling of a story told by someone who means it, not produced by someone who knows how.</p>

    <h4>The Anatomy of the Translation</h4>
    <h5>The Visual World</h5>
    <p>
      The puppets were made from paper, sticks, and cello tape. I didn’t have the time or skill to build string marionettes — so sticks became the mechanism, and the hands moving them stayed close. Paper birds, raw and slightly fragile, against a black background lit in yellow.
    </p>
    <p>I didn’t design that aesthetic deliberately. But once I saw it — warm lamplight on handmade birds, a void behind them — it felt exactly right. It looked like something old. Not polished old. Honest old. The physical limitation of the puppets — they can only move as far as your hands can reach, they wobble slightly, they are unmistakably made — matched the poem’s own vulnerability. The bird in the poem is small against the sky. The puppet is small against the dark.</p>
    

    <h5>The Auditory World</h5>
    <p>Janvi recorded the narration in the sound room with an H1N mic. Clean, clear, uncluttered. The rawness would live everywhere else. Around her voice, I layered sound — wind, bird calls, thunder, tabla. But the thing I was most careful about was the space between. The poem breathes. Each sound had room to arrive, to mean something, before the next one came. The silence was part of the design.</p>
    
    <h5>The Time Element</h5>
    <p>The pacing follows the poem’s own logic. Slow at the start — the bird is still, the cage is still, time stretches. As the poem builds toward its choice, the pacing tightens. When the bird makes its decision, something shifts. The edit doesn’t announce this. It just tries not to get in the way of what’s already there.</p>    

    <h4>The Hurdles of the Solo Director</h4>
    <h5>The Multi-Tasking Friction</h5>
    <p>It wasn’t solo — that matters to say clearly. Vaibhav handled the camera. My roommate helped move the puppets alongside me. Janvi’s narration was pre-recorded and played back during the shoot. But the coordination was still fragile: four people, a small room, paper birds on sticks, timing every movement to a poem playing back through a speaker. We had cropping problems. Pacing issues. Moments where a puppet moved too early or the shot didn’t hold. We went again. And again.</p>

    <h5>Embracing the Flaws</h5>
    <p>The final piece still has imperfections in it — and I kept them. Not as an artistic statement. Just because removing them would have removed something true. This was made by hand, by a small group of people, for a poem that had lived in my memory for years. The imperfections are a timestamp. They show where I was as a maker at that point. That feels honest rather than unfortunate.</p>

    <h5>The Academic Constraint</h5>

    <p>The course offered more technical tools — computational, digital, processed. I went the other way. Not to reject the curriculum, but because the poem asked for it. A poem about raw, uncontainable freedom didn’t want to be rendered in AfterEffects. The constraint I pushed against wasn’t the grading rubric — it was the assumption that newer and more complex means more expressive.</p>

    <h4>The Artifact & Reflection</h4>
    <p>Making this, I understood something about how I work: I put a lot of effort into surfacing deeper things simply. The tools were humble — paper, sticks, a borrowed mic, a few friends, a small room. But I always try to make the experience cohere, to put my point of view into it, to make something that holds together even when it isn’t perfect.
    </p>
    <p>The poem has a visual now. When I read those stanzas, I see the birds I made. That is what the work gave back.
    </p>
