// ── AQI color helpers ────────────────────────────────────────────────────────
function aqiToRgb(aqi) {
  const v = Math.max(100, Math.min(420, aqi));
  const stops = [
    [100, [220, 160,  0]],   // deep amber
    [200, [210,  80,  0]],   // burnt orange
    [280, [200,  20, 10]],   // vivid red
    [340, [140,   0,  0]],   // deep red
    [400, [ 80,   0,  0]],   // dark crimson
    [420, [ 40,   0,  0]],   // near black-red
  ];
  for (let i = 0; i < stops.length-1; i++) {
    const [a,ca] = stops[i], [b,cb] = stops[i+1];
    if (v >= a && v <= b) {
      const t = (v-a)/(b-a);
      return ca.map((c,j) => Math.round(c + t*(cb[j]-c)));
    }
  }
  return stops[stops.length-1][1];
}
function aqiColor(aqi) {
  if (!aqi) return '#bbb';
  const [r,g,b] = aqiToRgb(aqi);
  return `rgb(${r},${g},${b})`;
}
function aqiCat(aqi) {
  if (!aqi) return 'No data';
  if (aqi<=50) return 'Good';
  if (aqi<=100) return 'Satisfactory';
  if (aqi<=200) return 'Moderate';
  if (aqi<=300) return 'Poor';
  if (aqi<=400) return 'Very Poor';
  return 'Severe';
}

// ── AQI heatmap layer ─────────────────────────────────────────────────────────
const AQILayer = L.Layer.extend({
  onAdd(map) {
    this._map = map;
    const pane = map.getPane('overlayPane');
    this._canvas = document.createElement('canvas');
    this._canvas.style.cssText = 'position:absolute;pointer-events:none;image-rendering:auto;';
    pane.appendChild(this._canvas);
    map.on('moveend zoomend resize', this._redraw, this);
    this._redraw();
  },
  onRemove(map) {
    this._canvas.remove();
    map.off('moveend zoomend resize', this._redraw, this);
  },
  setOpacity(v) {
    this._opacity = v;
    if (this._canvas) this._canvas.style.opacity = v;
  },
  _redraw() {
    const map = this._map;
    const size = map.getSize();
    const W = size.x, H = size.y;
    this._canvas.width = W; this._canvas.height = H;
    const tl = map.containerPointToLayerPoint([0,0]);
    L.DomUtil.setPosition(this._canvas, tl);
    const ctx = this._canvas.getContext('2d');
    const img = ctx.createImageData(W, H);
    const d = img.data;

    const SCALE = 3;
    const GW = Math.ceil(W/SCALE), GH = Math.ceil(H/SCALE);
    const grid = new Float32Array(GW*GH);
    const stPx = AQI_STATIONS.map(s => {
      const pt = map.latLngToContainerPoint([s[1], s[2]]);
      return { x: pt.x, y: pt.y, aqi: s[3] };
    });
    const POWER = 2.8;
    for (let gy=0; gy<GH; gy++) {
      for (let gx=0; gx<GW; gx++) {
        const px=gx*SCALE+SCALE/2, py=gy*SCALE+SCALE/2;
        let wSum=0, vSum=0;
        for (const st of stPx) {
          const dx=px-st.x, dy=py-st.y, dist2=dx*dx+dy*dy;
          if (dist2<1) { vSum=st.aqi; wSum=1; break; }
          const w=1/Math.pow(dist2, POWER/2);
          wSum+=w; vSum+=w*st.aqi;
        }
        grid[gy*GW+gx]=vSum/wSum;
      }
    }
    for (let py=0; py<H; py++) {
      for (let px=0; px<W; px++) {
        const gxf=px/SCALE-.5, gyf=py/SCALE-.5;
        const gx0=Math.max(0,Math.floor(gxf)), gy0=Math.max(0,Math.floor(gyf));
        const gx1=Math.min(GW-1,gx0+1), gy1=Math.min(GH-1,gy0+1);
        const tx=gxf-gx0, ty=gyf-gy0;
        const aqi = grid[gy0*GW+gx0]*(1-tx)*(1-ty)+grid[gy0*GW+gx1]*tx*(1-ty)+grid[gy1*GW+gx0]*(1-tx)*ty+grid[gy1*GW+gx1]*tx*ty;
        const [r,g,b]=aqiToRgb(aqi);
        const i=(py*W+px)*4;
        d[i]=r; d[i+1]=g; d[i+2]=b; d[i+3]=255;
      }
    }
    ctx.putImageData(img,0,0);
    this._canvas.style.filter='blur(16px)';
    this._canvas.style.opacity=this._opacity||0.75;
  }
});

// Helper: get nearest AQI station value for a store location
function getNearestAQI(lat, lng) {
  let best = null, bestDist = Infinity;
  for (const s of AQI_STATIONS) {
    const dlat = (lat-s[1])*111, dlng = (lng-s[2])*111*Math.cos(lat*Math.PI/180);
    const d = dlat*dlat + dlng*dlng;
    if (d < bestDist) { bestDist=d; best=s; }
  }
  return best;
}

  const [name, lat, lng] = store;
  const nearest = getNearestAQI(lat, lng);
  const aqi     = nearest ? nearest[3] : null;
  const color   = aqiColor(aqi);
  const area    = name.replace(/^(DEL|NOD|GZB)-/,'');
  const zone    = name.startsWith('NOD') ? 'Noida' : name.startsWith('GZB') ? 'Ghaziabad' : 'Delhi';

  const icon = L.divIcon({
    className: '',
    html: `<div class="store-icon" title="${name}">${storeSVG}</div>`,
    iconSize:   [26, 26],
    iconAnchor: [13, 13],
    popupAnchor:[0, -16],
  });

  const barW = aqi ? Math.min(100, Math.round(aqi/5)) : 0;
  const popup = `<div class="store-popup">
    <div class="sp-name">🏪 ${area}</div>
    <div class="sp-area">${zone} · Dark Store</div>
    ${aqi ? `<div class="sp-aqi">
      Nearest AQI station: <b>${nearest[0]}</b><br>
      Peak AQI: <b style="color:${color}">${aqi}</b> — ${aqiCat(aqi)}<br>
      Peak month: ${nearest[4]}
      <div class="popup-bar" style="margin-top:5px"><div class="popup-bar-fill" style="width:${barW}%;background:${color}"></div></div>
    </div>` : ''}
  </div>`;

  L.marker([lat, lng], { icon, zIndexOffset: 1000 })
    .bindPopup(popup, { maxWidth: 230 })
    .addTo(map);
});

// ── Opacity slider ────────────────────────────────────────────────────────────
document.getElementById('opSlider').addEventListener('input', function() {
  aqiLayer.setOpacity(parseFloat(this.value));
});
</script>
</body>
</html>
